version: '3.8'

services:
  app:
    image: fabreguesm/releasenoteservice:0.6.0
    ports:
      - target: 3000
        published: ${PUERTO:-8300}
        protocol: tcp
        mode: host
    networks:
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints: ['${NODE:?definir en Portainer, p. ej. node.hostname==NOMBRE_DEL_NODO}']
      resources:
        limits:
          memory: 1g
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        order: stop-first
    environment:
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?definir en Portainer, contrasena fuerte}
      SESSION_SECRET: ${SESSION_SECRET:?definir en Portainer, minimo 32 caracteres}
      PUBLIC_URL: ${PUBLIC_URL:?definir en Portainer, p. ej. http://10.0.0.5:8300}
      INGEST_BITBUCKET_TOKEN: ${INGEST_BITBUCKET_TOKEN:-}
    volumes:
      - data:/data
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?definir en Portainer, la URL de push de Loki}

volumes:
  data:
    name: '${SERVICE_NAME:?definir en Portainer, p. ej. releasenotes}_data'

networks:
  traefik:
    external: true
    name: traefik-network

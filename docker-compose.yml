version: '3.6'

services: 
  backend:
    image: fabreguesm/flexxus-order-backend:staging
    hostname: flxorder-flexxus-com-ar
    ports: 
      - "7000:5000"
    networks:
      - traefik
    deploy:      
      placement:
        constraints: ["${NODE}"]
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_TYPE=MariaDB
      - PREWARM_LICENSE=false
      - PREWARM_CONNECTORS=false
    restart: unless-stopped
    volumes:
      - 'node_data:/app/data/'
      - 'factura_data:/app/factura_electronica/'
      - 'pdf_data:/app/public/pdf/' 
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}  

  frontend:
    image: fabreguesm/flexxus-order-frontend:staging
    ports: 
      - "7001:80"
    networks:
      - traefik
    deploy:      
      placement:
        constraints: ["${NODE}"]           
    environment:
      - VITE_GATEWAY_SECRET_KEY=${VITE_GATEWAY_SECRET_KEY}
    restart: unless-stopped 
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}  

  storybook:
    image: fabreguesm/flexxus-order-storybook:staging
    ports:
      - "7002:80"
    restart: unless-stopped  
    networks:
      - traefik
    deploy:      
      placement:
        constraints: ["${NODE}"]          
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

